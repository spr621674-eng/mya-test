name: Android Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для этой сборки (например 1.21.0) — впишите то же число, что потом укажете тегом в Release"
        type: string
        default: "0.0.0"
      include_x86:
        description: "Добавить x86_64 (для эмулятора; в релиз не нужен)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Версия берётся либо из тега (если пушите теги git напрямую), либо из
      # поля "version", которое вписываете при нажатии Run workflow. versionCode
      # Android ОБЯЗАН расти с каждым обновлением, иначе система откажется
      # ставить новую сборку поверх старой — поэтому он не связан с введённым
      # текстом, а берётся из номера запуска Actions, который растёт сам.
      - name: Determine version
        id: ver
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            VERSION="${REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Собираю версию: $VERSION (versionCode ${{ github.run_number }})"

      - name: Stamp version into build files
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          CODE="${{ github.run_number }}"
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/const BUILD = '[^']*';/const BUILD = 'v$VERSION';/" www/index.html
          echo "versionCode=$CODE versionName=$VERSION записаны в build.gradle и index.html"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: gomobile init
        run: gomobile init

      # Конвертер подписок (Xray JSON / список ссылок → YAML mihomo) проверяется
      # тем же парсером, которым ядро читает конфиг: переименованное в mihomo поле
      # иначе всплывёт уже на телефоне — туннель поднят, трафика нет.
      # Теги те же, что у сборки: без with_gvisor mihomo не соберёт узел WireGuard.
      - name: Test mihomo core
        working-directory: core
        run: go test -tags with_gvisor,cmfa ./...

      - name: Build mihomo core .aar
        working-directory: core
        run: |
          go mod download
          # target включает amd64 (x86_64-эмуляторы), ldflags выравнивает .so под 16 КБ
          # страницы (Android 15 / 16 KB page size), иначе либа не грузится на новых образах.
          # -tags with_gvisor ОБЯЗАТЕЛЕН: без него sing-tun подставляет заглушку,
          # TUN не поднимается и трафик молча уходит в никуда.
          # -tags cmfa ОБЯЗАТЕЛЕН (режим встраивания, ClashMetaForAndroid): без него
          # sing_tun при старте TUN лезет читать /data/system/packages.xml (маппинг
          # пакет→UID для android-rules) → на неroot Android permission denied →
          # "Start TUN listening error" → TUN не поднимается (подключено, но трафика нет).
          # С cmfa buildAndroidRules = no-op, пакетную фильтрацию делает VpnService.
          # -s -w выкидывают таблицу символов и отладочную информацию: это ~14 МБ
          # на каждую архитектуру, в релизе они не нужны.
          # x86_64 нужен только для эмулятора, в обычный релиз не кладём — иначе
          # пользователи качают лишние ~25 МБ.
          TARGETS="android/arm64,android/arm"
          if [ "${{ github.event.inputs.include_x86 }}" = "true" ]; then
            TARGETS="$TARGETS,android/amd64"
          fi
          echo "targets: $TARGETS"
          gomobile bind -v \
            -target="$TARGETS" \
            -androidapi 21 \
            -tags with_gvisor,cmfa \
            -ldflags="-s -w -extldflags=-Wl,-z,max-page-size=16384" \
            -o mihomo.aar .
          mkdir -p ../android/app/libs
          cp mihomo.aar ../android/app/libs/mihomo.aar

      - name: Sync web assets + native plugin config into android project
        working-directory: .
        run: |
          npm install
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          npx cap sync android

      # Ключ проверяется сразу после декодирования. Без проверки битый keystore
      # всплывает только на packageRelease — через две минуты сборки и в виде
      # ASN.1-исключения ("Tag number over 30 is not supported"), по которому
      # не понять, что именно сломалось: файл, пароль или алиас.
      # В форке нет приватных секретов автора (ANDROID_KEYSTORE_BASE64 и т.д.) —
      # они не копируются вместе с репозиторием. Поэтому генерируем свой ключ
      # прямо тут, каждый раз заново.
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/misetanibox-release.p12" \
            -storetype PKCS12 \
            -alias misetanibox \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass misetanibox123 -keypass misetanibox123 \
            -dname "CN=Misetanibox, OU=Personal, O=Personal, L=Unknown, S=Unknown, C=RU"

      - name: Build release APK (signed)
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/misetanibox-release.p12
          ANDROID_KEYSTORE_PASSWORD: misetanibox123
          ANDROID_KEY_ALIAS: misetanibox
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Misetanibox_android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Misetanibox_android
          path: Misetanibox_android.apk
          retention-days: 14
